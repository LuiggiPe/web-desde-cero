<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reproductor Live</title>
    <style>
        body {
            background-color: #0f172a;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column; /* Alinea el botón arriba y el reproductor abajo */
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
        }

        /* 🌟 ESTILO DEL BOTÓN PARA IR A LA SEGUNDA PÁGINA */
        .nav-button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none; /* Quita la línea de enlace */
            margin-bottom: 20px;   /* Separa el botón del reproductor */
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }

        .nav-button:hover {
            background-color: #0ea5e9;
            transform: scale(1.05);
        }

        .player-container {
            width: 100%;
            max-width: 854px;
            aspect-ratio: 16 / 9;
            background-color: #000000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        #player {
            width: 100%;
            height: 100%;
        }

        @media (max-width: 768px) {
            .player-container {
                width: 100%;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>

    <a href="juegos.html" class="nav-button">Ir a la Segunda Página 🎮</a>

    <div class="player-container">
        <div id="player"></div>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@clappr/player@0.3.5/dist/clappr.min.js"></script>

    <script>
        var player = new Clappr.Player({
            source: "https://am91cm5leQ.fubo18.com:443/sportv/mono.m3u8?token=5080ec63b62e48771ae464b27c4728ee5f4d95a8-73-1781415459-1781397459", 
            parentId: "#player",
            width: "100%",
            height: "100%",
            autoPlay: false,                
            preload: "auto",
            mimeType: "application/x-mpegURL",
            playback: {
                playInline: true,          
                hlsjsConfig: {
                    enableWorker: true,    
                    lowLatencyMode: true
                }
            },
            disableVideoTagContextMenu: true
        });
    </script>

</body>
</html>
