<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reproductor Live Móvil</title>
    <style>
        /* Estilos base (Para Computadoras) */
        body {
            background-color: #0f172a;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; /* Evita barras de desplazamiento molestas en móviles */
        }

        .player-container {
            width: 90%;
            max-width: 854px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border-radius: 12px;
            overflow: hidden;
            background-color: #000000;
        }

        #player {
            width: 100%;
            aspect-ratio: 16 / 9; /* Mantiene la proporción correcta de TV siempre */
        }

        /* 📱 OPTIMIZACIÓN EXCLUSIVA PARA DISPOSITIVOS MÓVILES (Pantallas verticales pequeñas) */
        @media (max-width: 768px) {
            body {
                padding: 10px;
                box-sizing: border-box;
            }
            
            .player-container {
                width: 100%; /* Aprovecha el 100% del ancho del celular */
                border-radius: 8px; /* Bordes un poco más sutiles en pantallas pequeñas */
            }
        }

        /* 🔄 OPTIMIZACIÓN CUANDO SE GIRA EL CELULAR EN HORIZONTAL (Modo Pantalla Completa) */
        @media (max-width: 900px) and (orientation: landscape) {
            body {
                padding: 0;
            }
            .player-container {
                width: 100vw;
                height: 100vh;
                max-width: none;
                border-radius: 0; /* Elimina bordes para simular pantalla completa */
            }
            #player {
                width: 100%;
                height: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="player-container">
        <div id="player"></div>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"></script>

    <script>
        var player = new Clappr.Player({
            // Recuerda ir actualizando este enlace si el token expira
            source: "https://am91cm5leQ.fubo18.com:443/sportv/mono.m3u8?token=5080ec63b62e48771ae464b27c4728ee5f4d95a8-73-1781415459-1781397459", 
            parentId: "#player",
            width: "100%",
            height: "100%",
            autoPlay: true, 
            preload: "auto",
            mimeType: "application/x-mpegURL",
            // Configuraciones añadidas para mejorar la experiencia táctil en celulares:
            disableVideoTagContextMenu: true, // Evita que en Android/iOS salga el menú de descargar video al mantener presionado
            mediacontrol: { seekbar: "#38bdf8", buttons: "#ffffff" }
        });
    </script>

</body>
</html>
</body>
</html>
