<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Reproductor Web</title>
    <style>
        /* 🎨 ESTILOS GENERALES (Fondo oscuro y centrado) */
        body {
            background-color: #0f172a;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* 🎮 BOTÓN PARA IR A JUEGOS.HTML */
        .nav-button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 25px;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
            transition: transform 0.2s, background-color 0.2s;
            z-index: 10;
        }

        .nav-button:hover {
            background-color: #0ea5e9;
            transform: scale(1.05);
        }

        /* 📺 CONTENEDOR DEL REPRODUCTOR */
        .player-container {
            width: 95%;
            max-width: 854px;
            aspect-ratio: 16 / 9;
            background-color: #000000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        #player {
            width: 100%;
            height: 100%;
        }

        /* 📱 AJUSTES RESPONSIVOS PARA MÓVILES */
        @media (max-width: 768px) {
            body {
                padding: 10px;
                box-sizing: border-box;
            }
            .nav-button {
                width: 80%;
                text-align: center;
                padding: 14px 0;
            }
            .player-container {
                width: 100%;
                border-radius: 8px;
            }
        }

        /* 🔄 MODO HORIZONTAL EN MÓVILES (Simula pantalla completa) */
        @media (max-width: 900px) and (orientation: landscape) {
            body {
                padding: 0;
            }
            .nav-button {
                display: none; /* Esconde el botón al girar el celular para dar prioridad al video */
            }
            .player-container {
                width: 100vw;
                height: 100vh;
                max-width: none;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>

    <a href="juegos.html" class="nav-button">Ir a la Página de Juegos 🎮</a>

    <div class="player-container">
        <div id="player"></div>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@clappr/player@0.3.5/dist/clappr.min.js"></script>

    <script>
        var player = new Clappr.Player({
            // El enlace directo .m3u8 que compartiste
            source: "https://am91cm5leq.fubo18.com/sportv/mono.m3u8?token=5080ec63b62e48771ae464b27c4728ee5f4d95a8-73-1781415459-1781397459", 
            parentId: "#player",
            width: "100%",
            height: "100%",
            autoPlay: false, // En falso para que no choque con los bloqueos de sonido de los celulares
            preload: "auto",
            mimeType: "application/x-mpegURL",
            mediacontrol: { seekbar: "#38bdf8", buttons: "#ffffff" },
            hideMediaControl: false, // Evita que los controles se oculten solos al inicio
            
            playback: {
                playInline: true, // Clave para que en iOS (iPhone) no se abra el reproductor del sistema
                hlsjsConfig: {
                    enableWorker: true,
                    lowLatencyMode: true
                }
            },
            disableVideoTagContextMenu: true // Protege el elemento de video en móviles
        });

        // Asegura que los controles (incluido el botón grande de Play) se muestren al cargar la web
        player.on(Clappr.Events.PLAYER_READY, function() {
            player.getPlugin('click_to_pause').disable(); 
            setTimeout(function(){
                player.mediaControl.show(); 
            }, 800);
        });
    </script>

</body>
</html>
</html>
