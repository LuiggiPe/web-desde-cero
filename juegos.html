<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Win Sports+ Live</title>
    <style>
        body {
            background-color: #0f172a;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* Botón gris elegante para volver al primer canal */
        .back-button {
            background-color: #e2e8f0;
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 25px;
            box-shadow: 0 4px 14px rgba(255, 255, 255, 0.1);
            transition: transform 0.2s, background-color 0.2s;
            display: inline-block;
        }

        .back-button:hover {
            background-color: #cbd5e1;
            transform: scale(1.05);
        }

        .player-container {
            width: 95%;
            max-width: 854px;
            aspect-ratio: 16 / 9;
            background-color: #000000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border-radius: 12px;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        @media (max-width: 768px) {
            body { padding: 10px; box-sizing: border-box; }
            .back-button { width: 80%; text-align: center; padding: 14px 0; }
            .player-container { width: 100%; border-radius: 8px; }
        }

        @media (max-width: 900px) and (orientation: landscape) {
            body { padding: 0; }
            .back-button { display: none; }
            .player-container { width: 100vw; height: 100vh; max-width: none; border-radius: 0; }
        }
    </style>
    <!-- Cargamos el motor Hls.js que nos dio resultado antes -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

    <!-- Botón para regresar a index.html (SporTV) -->
    <a href="index.html" class="back-button">⬅ Volver al Primer Canal</a>

    <!-- El segundo reproductor para Win Sports+ -->
    <div class="player-container">
        <video id="video-win" controls playsinline></video>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', function() {
            var video = document.getElementById('video-win');
            // Tu nuevo enlace .m3u8 de Win Sports+
            var videoSrc = "https://eWVz.fubo18.com:443/winsportsplus/mono.m3u8?token=f8fd8b70af22d1e9e0363489dac351982ddd9717-e3-1781455366-1781437366";

            if (Hls.isSupported()) {
                var hls = new Hls();
                hls.loadSource(videoSrc);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    console.log("Win Sports+ listo");
                });
                
                hls.on(Hls.Events.ERROR, function (event, data) {
                    console.log("Error en el stream de Win, controles protegidos.");
                });
            }
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = videoSrc;
            }
        });
    </script>

</body>
</html>
