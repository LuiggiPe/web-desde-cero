<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segunda Página - Juegos</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        h1 {
            color: #38bdf8;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        p {
            color: #94a3b8;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        /* 🌟 BOTÓN PARA VOLVER A LA PÁGINA PRINCIPAL */
        .back-button {
            background-color: #e2e8f0;
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 14px rgba(255, 255, 255, 0.1);
            transition: transform 0.2s, background-color 0.2s;
        }

        .back-button:hover {
            background-color: #cbd5e1;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>Bienvenido a la Segunda Página</h1>
    <p>Aquí puedes agregar tus juegos u otro contenido más adelante.</p>

    <a href="index.html" class="back-button">⬅ Volver al Reproductor</a>

</body>
</html>
