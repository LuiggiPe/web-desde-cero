<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reproductor Live Móvil Fix</title>
    <style>
        body {
            background-color: #0f172a;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
        }

        .player-container {
            width: 100%;
            max-width: 854px;
            aspect-ratio: 16 / 9;
            background-color: #000000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        #player {
            width: 100%;
            height: 100%;
        }

        /* Ajuste para telas pequenas */
        @media (max-width: 768px) {
            .player-container {
                width: 100%;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>

    <div class="player-container">
        <div id="player"></div>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@clappr/player@0.3.5/dist/clappr.min.js"></script>

    <script>
        var player = new Clappr.Player({
            source: "https://am91cm5leQ.fubo18.com:443/sportv/mono.m3u8?token=5080ec63b62e48771ae464b27c4728ee5f4d95a8-73-1781415459-1781397459", 
            parentId: "#player",
            width: "100%",
            height: "100%",
            
            // 🚀 AJUSTES CRUCIALES PARA MÓVILES:
            autoPlay: false,                // Deixamos em false para que o utilizador clique no "Play" (móveis exigem toque humano)
            preload: "auto",
            mimeType: "application/x-mpegURL",
            
            // Configurações internas do Clappr para compatibilidade móvel
            playback: {
                playInline: true,          // Impede que o iOS abra o vídeo no player nativo do iPhone em tela cheia automática
                hlsjsConfig: {
                    enableWorker: true,    // Melhora o desempenho do streaming no Android
                    lowLatencyMode: true
                }
            },
            disableVideoTagContextMenu: true
        });
    </script>

</body>
</html>
