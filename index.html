<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor SporTV</title>
    <style>
        body {
            background-color: #0f172a;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
        }
        #player {
            width: 100%;
            max-width: 854px;
            aspect-ratio: 16 / 9;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div id="player"></div>

    <!-- Cargamos Clappr y su plugin para HLS (reproducción de .m3u8) -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"></script>

    <script>
        var player = new Clappr.Player({
            // Pegamos tu nuevo enlace .m3u8 completo aquí adentro
            source: "https://am91cm5leQ.fubo18.com:443/sportv/mono.m3u8?token=5080ec63b62e48771ae464b27c4728ee5f4d95a8-73-1781415459-1781397459", 
            parentId: "#player",
            width: "100%",
            height: "100%",
            autoPlay: true, // Intenta reproducir automáticamente
            preload: "auto",
            mimeType: "application/x-mpegURL" // Obliga a Clappr a leerlo como HLS
        });
    </script>

</body>
</html>

</body>
</html>
