<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Reproductor Web</title>
    <style>
        body {
            background-color: #0f172a;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* El botón azul que querías */
        .nav-button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 25px;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
            transition: transform 0.2s, background-color 0.2s;
            display: inline-block;
        }

        .nav-button:hover {
            background-color: #0ea5e9;
            transform: scale(1.05);
        }

        .player-container {
            width: 95%;
            max-width: 854px;
            aspect-ratio: 16 / 9;
            background-color: #000000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border-radius: 12px;
            overflow: hidden;
        }

        /* Forzamos que el video ocupe todo su espacio */
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        @media (max-width: 768px) {
            body { padding: 10px; box-sizing: border-box; }
            .nav-button { width: 80%; text-align: center; padding: 14px 0; }
            .player-container { width: 100%; border-radius: 8px; }
        }

        @media (max-width: 900px) and (orientation: landscape) {
            body { padding: 0; }
            .nav-button { display: none; }
            .player-container { width: 100vw; height: 100vh; max-width: none; border-radius: 0; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

    <a href="juegos.html" class="nav-button">Ir a la Página de Juegos 🎮</a>

    <div class="player-container">
        <video id="video" controls playsinline></video>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', function() {
            var video = document.getElementById('video');
            // Aquí pones tu enlace modificado
            var videoSrc = "https://am91cm5leq.fubo18.com/sportv/mono.m3u8?token=5080ec63b62e48771ae464b27c4728ee5f4d95a8-73-1781415459-1781397459";

            if (Hls.isSupported()) {
                var hls = new Hls();
                hls.loadSource(videoSrc);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    console.log("Stream listo para reproducir");
                });
                
                // Si el enlace falla o tira error de token, el reproductor no se muere
                hls.on(Hls.Events.ERROR, function (event, data) {
                    console.log("Error de carga de stream, pero los controles siguen vivos.");
                });
            }
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Compatibilidad nativa para Safari (iPhone/Mac)
                video.src = videoSrc;
            }
        });
    </script>

</body>
</html>
